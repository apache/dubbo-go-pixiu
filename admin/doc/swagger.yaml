info:
  contact: {}
paths:
  /config/api/base:
    get:
      description: get pixiu base info such as name,desc
      produces:
      - application/json
      responses:
        "200":
          description: YAML content
          schema:
            type: string
      summary: get basic configuration of Pixiu
      tags:
      - Config
  /config/api/base/:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: Pass YAML content through the form's content field to set basic
        information.
      parameters:
      - description: YAML content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: modify pixiu base info such as name,desc
      tags:
      - Config
    put:
      consumes:
      - application/x-www-form-urlencoded
      description: Pass YAML content through the form's content field to set basic
        information.
      parameters:
      - description: YAML content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: modify pixiu base info such as name,desc
      tags:
      - Config
  /config/api/xds/status:
    get:
      description: Returns xDS listener availability, last-good snapshot metadata,
        latest errors, readiness, and resource support matrix.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: get Admin xDS publication status
      tags:
      - XDS
  /config/api/cluster:
    delete:
      description: delete cluster according to cluster ID
      parameters:
      - description: Cluster ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: delete cluster
      tags:
      - Config
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: pass the Cluster's YAML/JSON via the form's content field to update
        the cluster.
      parameters:
      - description: Cluster content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: update cluster
      tags:
      - Config
    put:
      consumes:
      - application/x-www-form-urlencoded
      description: Create a cluster by passing the YAML/JSON configuration for the
        cluster through the form's content field.
      parameters:
      - description: Cluster content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: create cluster
      tags:
      - Config
  /config/api/cluster/detail:
    get:
      description: get cluster detail according to cluster ID
      parameters:
      - description: Cluster ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get cluster detail
      tags:
      - Config
  /config/api/cluster/list:
    get:
      description: get all clusters' info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get cluster list
      tags:
      - Config
  /config/api/listener:
    delete:
      description: delete the Listener based on the name
      parameters:
      - description: Listener id
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: delete Listener
      tags:
      - Config
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: pass the YAML/JSON for the Listener through the form's content
        field to update the Listener.
      parameters:
      - description: Listener content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: update Listener
      tags:
      - Config
    put:
      consumes:
      - application/x-www-form-urlencoded
      description: pass the YAML/JSON for the Listener through the form's content
        field to create the Listener.
      parameters:
      - description: Listener content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: create a Listener
      tags:
      - Config
  /config/api/listener/detail:
    get:
      description: get Listener details based on name
      parameters:
      - description: Listener name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get Listener detail
      tags:
      - Config
  /config/api/listener/list:
    get:
      description: get all Listener list
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get all Listener list
      tags:
      - Config
  /config/api/opa/policy:
    delete:
      parameters:
      - description: OPA server url
        in: query
        name: server_url
        type: string
      - description: Policy ID
        in: query
        name: policy_id
        type: string
      - description: Bearer token
        in: query
        name: bearer_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: delete OPA policy (server mode)
      tags:
      - Config
    get:
      parameters:
      - description: OPA server url
        in: query
        name: server_url
        type: string
      - description: Policy ID
        in: query
        name: policy_id
        type: string
      - description: Bearer token
        in: query
        name: bearer_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get OPA policy (server mode)
      tags:
      - Config
    put:
      consumes:
      - application/x-www-form-urlencoded
      parameters:
      - description: OPA server url
        in: formData
        name: server_url
        type: string
      - description: Policy ID
        in: formData
        name: policy_id
        type: string
      - description: Bearer token
        in: formData
        name: bearer_token
        type: string
      - description: Rego content
        in: formData
        name: content
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: upload OPA policy (server mode)
      tags:
      - Config
  /config/api/route:
    delete:
      parameters:
      - description: Route binding name
        in: query
        name: name
        required: true
        type: string
      - description: Draft key mod revision
        in: query
        name: expectedRevision
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: delete and publish one API route binding
      tags:
      - Config
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: create API route binding draft
      tags:
      - Config
    put:
      consumes:
      - application/json
      parameters:
      - description: Original route binding name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: modify API route binding draft
      tags:
      - Config
  /config/api/route/detail:
    get:
      parameters:
      - description: Route binding name
        in: query
        name: name
        required: true
        type: string
      - description: draft or published
        in: query
        name: scope
        type: string
      - description: 1 for draft, 0 for published
        in: query
        name: unpublished
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get API route binding detail
      tags:
      - Config
  /config/api/route/diff:
    get:
      parameters:
      - description: Route binding name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get API route binding diff
      tags:
      - Config
  /config/api/route/list:
    get:
      parameters:
      - description: draft or published
        in: query
        name: scope
        type: string
      - description: 1 for draft, 0 for published
        in: query
        name: unpublished
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get API route binding list
      tags:
      - Config
  /config/api/route/preview:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: preview API route binding
      tags:
      - Config
  /config/api/route/publish:
    put:
      parameters:
      - description: Route binding name
        in: query
        name: name
        required: true
        type: string
      - description: Draft route key mod revision
        in: query
        name: expectedRevision
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: atomically publish one API route binding
      tags:
      - Config
  /config/api/route/schema:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get API route binding schema
      tags:
      - Config
  /config/api/route/status:
    get:
      parameters:
      - description: Route binding name
        in: query
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get API route binding status
      tags:
      - Config
  /config/api/route/validate:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: validate API route binding
      tags:
      - Config
  /register:
    post:
      parameters:
      - description: username
        in: formData
        name: username
        required: true
        type: string
      - description: password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"code":"","data":""}'
          schema:
            type: string
      summary: user registration
      tags:
      - Register
  /user/checkIsAdmin:
    post:
      description: to determine whether the current user is an administrator, the
        header must include the username.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: determine whether you are an administrator
      tags:
      - Account
  /user/getInfo:
    post:
      description: return the current user's detailed information. The header must
        include the username.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get user information
      tags:
      - Account
  /user/getUserRole:
    post:
      description: return the current user's role information. The header must include
        the username.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: get user role
      tags:
      - Account
  /user/logout:
    post:
      description: log out the current user (invalidate the token)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: user logout
      tags:
      - Account
  /user/password/edit:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: to modify the current user's password, the username must be included
        in the header.
      parameters:
      - description: old password
        in: formData
        name: oldPassword
        required: true
        type: string
      - description: new password
        in: formData
        name: newPassword
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: modify account password
      tags:
      - Account
swagger: "2.0"
