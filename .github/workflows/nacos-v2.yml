name: Nacos v2 Integration

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'pkg/remote/nacos/**'
      - 'pkg/adapter/**/nacos/**'
      - '.github/workflows/nacos-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nacos-v2:
    runs-on: ubuntu-latest
    services:
      nacos:
        image: nacos/nacos-server:v2.3.2
        env:
          MODE: standalone
          NACOS_AUTH_ENABLE: 'false'
          JVM_XMS: 256m
          JVM_XMX: 512m
          JVM_XMN: 128m
        ports:
          - 8848:8848
          - 9848:9848
        options: >-
          --health-cmd "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify registration and discovery through Nacos v2 gRPC
        env:
          NACOS_TEST_ADDRESS: 127.0.0.1:8848
        run: go test ./pkg/remote/nacos -run '^TestNacosV2Integration$' -race -count=1 -timeout=90s
