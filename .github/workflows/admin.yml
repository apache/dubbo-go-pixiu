name: Admin CI

on:
  push:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== pixiu-admin-web ====================
  pixiu-admin-web-lint:
    name: pixiu-admin-web Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: admin/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  pixiu-admin-web-typecheck:
    name: pixiu-admin-web Type Check
    runs-on: ubuntu-latest
    needs: pixiu-admin-web-lint
    defaults:
      run:
        working-directory: admin/web
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: admin/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

  # ==================== pixiu-admin-api ====================
  pixiu-admin-api-lint:
    name: pixiu-admin-api Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          working-directory: admin

  pixiu-admin-api-test:
    name: pixiu-admin-api Test
    runs-on: ubuntu-latest
    needs: pixiu-admin-api-lint
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./admin/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          flags: admin
