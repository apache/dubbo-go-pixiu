# openssl genrsa -out httpbin.key 2048
# openssl req -x509 -new -nodes -key httpbin.key -subj "/CN=httpbin.example.com" -days 365 -out httpbin.crt
# kubectl create secret tls httpbin-tls --cert=httpbin.crt --key=httpbin.key
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pixiu-ingress-https
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - httpbin.example.com
      secretName: httpbin-tls
  ingressClassName: pixiu
  rules:
    - host: httpbin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: httpbin
                port:
                  number: 80