static_resources:
  listeners:
    - name: "ai-gateway-listener"
      protocol_type: "HTTP"
      address:
        socket_address:
          address: "0.0.0.0"
          port: 8888
      filter_chains:
        filters:
          - name: dgp.filter.httpconnectionmanager
            config:
              route_config:
                routes:
                  - match:
                      prefix: "/v1/chat/completions"
                    route:
                      cluster: "sglang_cluster"
                      cluster_not_found_response_code: 503
              http_filters:
                - name: dgp.filter.ai.kvcache
                  config:
                    enabled: true
                    backend: redis
                    engine_type: sglang
                    redis:
                      cluster_mode: false
                      addrs:
                        - "127.0.0.1:6379"
                      password: ""
                      key_prefix: "pixiu:sglang:kvcache"
                      pool_size: 100
                    cache_key:
                      include_model: true
                      include_session_id: true
                      include_prompt: true
                    default_ttl: 3600s
                    target_models:
                      - "meta-llama/Llama-3.1-8B-Instruct"
                      - "Qwen/Qwen2.5-7B-Instruct"
                - name: dgp.filter.llm.proxy
                  config:
                    timeout: 60s
                    scheme: http
      config:
        idle_timeout: 5s
        read_timeout: 300s
        write_timeout: 300s

  clusters:
    - name: sglang_cluster
      lb_policy: round_robin
      endpoints:
        - id: sglang-instance-1
          socket_address:
            address: "127.0.0.1"
            port: 30000
          llm_meta:
            retry_policy:
              name: "NoRetry"
