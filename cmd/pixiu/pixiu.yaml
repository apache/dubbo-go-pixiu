static_resources:
  listeners:
    - name: "ai-gateway-listener"
      protocol_type: "HTTP"
      address:
        socket_address:
          address: "0.0.0.0"
          port: 8888
      filter_chains:
        filters:
          - name: dgp.filter.httpconnectionmanager
            config:
              route_config:
                routes:
                  - match:
                      prefix: "/v1/chat/completions"
                    route:
                      cluster: "mock_adapter"
                      cluster_not_found_response_code: 503
              http_filters:
                - name: dgp.filter.ai.kvcache
                  config:
                    enabled: true
                    backend: "noop"
                    default_use_cache: true
                    default_mode: "reuse"
                    drop_client_headers: true
                    cache_key:
                      include_model: true
                      include_session_id: true
                      include_prompt: false
                    default_ttl: 60s
                    target_models:
                      - "test-model"
                - name: dgp.filter.llm.proxy
                  config:
                    timeout: 60s
                    scheme: http
      config:
        idle_timeout: 5s
        read_timeout: 300s
        write_timeout: 300s

  clusters:
    - name: mock_adapter
      lb_policy: round_robin
      endpoints:
        - id: mock-adapter-1
          socket_address:
            address: "127.0.0.1"
            port: 18080
          llm_meta:
            retry_policy:
              name: "NoRetry"
