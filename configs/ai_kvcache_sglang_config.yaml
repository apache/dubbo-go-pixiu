static_resources:
  listeners:
    - name: "ai-gateway-listener"
      protocol: HTTP
      address:
        socket_address:
          address: "0.0.0.0"
          port: 8888
      filter_chains:
        - filters:
            # KV Cache Filter
            - name: dgp.filter.ai.kvcache
              config:
                enabled: true
                backend: redis
                engine_type: sglang  # 指定推理引擎
                redis:
                  cluster_mode: true
                  addrs:
                    - "redis-cluster-node-1:6379"
                    - "redis-cluster-node-2:6379"
                    - "redis-cluster-node-3:6379"
                  password: "your_redis_password"
                  key_prefix: "pixiu:sglang:kvcache"
                  pool_size: 100
                cache_key:
                  include_model: true
                  include_session_id: true
                  include_prompt: true
                default_ttl: 3600s
                target_models:
                  - "meta-llama/Llama-3.1-8B-Instruct"
                  - "Qwen/Qwen2.5-7B-Instruct"

            # LLM Proxy
            - name: dgp.filter.llm.proxy
              config:
                timeout: 60s
                scheme: http

  clusters:
    - name: sglang_cluster
      lb_policy: round_robin
      endpoints:
        - id: sglang-instance-1
          socket_address:
            address: "sglang-service"
            port: 30000
        - id: sglang-instance-2
          socket_address:
            address: "sglang-service"
            port: 30001