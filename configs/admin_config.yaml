server:
  address: "0.0.0.0"
  port: 8081

etcd:
  address: "127.0.0.1:2379"
  path: "/pixiu/config"

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "123456"
  dbname: "pixiu_admin"

# JWT Authentication Configuration
# IMPORTANT: Change sign-key in production!
# You can use environment variable: sign-key: "${JWT_SIGN_KEY}"
jwt:
  sign-key: "${JWT_SIGN_KEY}"  # Set JWT_SIGN_KEY environment variable in production
  expire-hours: 24             # Token expiration time in hours
  issuer: "pixiu-admin"        # JWT issuer

zap:
  level: "debug"
  format: "console"
  prefix: "[DUBBOGO-PIXIU-ADMIN]"
  director: "logs"
  show-line: true
  encode-level: "LowercaseColorLevelEncoder"
  log-in-console: true

system:
  env: "public"
  addr: 8081
  db-type: "mysql"
